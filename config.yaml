# UR10e PPO 多目标最优轨迹规划配置文件
# 基于论文《基于深度强化学习的机械臂多目标最优轨迹规划》

# 环境配置
env:
  # UR10e模型路径
  xml_path: "../universal_robots_ur10e/ur10e_mujoco/scene.xml"

  # 仿真参数
  max_steps: 1000              # 每个episode最大步数
  dt: 0.01                    # 仿真时间步（秒）
  enable_rendering: true      # 训练时关闭渲染以提高速度

  # UR10e物理参数
  joint_limits:                # UR10e关节限制 [min, max]（弧度）
    - [-3.14159, 3.14159]      # shoulder_pan_joint
    - [-3.14159, 3.14159]      # shoulder_lift_joint
    - [-3.14159, 3.14159]      # elbow_joint
    - [-3.14159, 3.14159]      # wrist_1_joint
    - [-3.14159, 3.14159]      # wrist_2_joint
    - [-3.14159, 3.14159]      # wrist_3_joint

  # 动作空间配置（RL-PID调度）
  action_bound: 0.5         # PID参数调度限制 [±0.5 = ±50%调整范围]
  action_dim: 3              # 动作空间维度 [kp_scale, kd_scale, ki_enable]
  state_dim: 16              # 状态空间维度（16维混合控制状态）

  # 状态归一化配置
  normalization:
    joint_positions:         # 关节位置归一化（基于UR10e实际限制）
      max_positions:         # 各关节最大位置 (rad)
        shoulder_pan: 6.283   # ±360° = ±2π rad
        shoulder_lift: 6.283  # ±360° = ±2π rad
        elbow: 3.142          # ±180° = ±π rad (人工限制)
        wrist_1: 6.283        # ±360° = ±2π rad
        wrist_2: 6.283        # ±360° = ±2π rad
        wrist_3: 6.283        # ±360° = ±2π rad

    joint_velocities:        # 关节速度归一化（基于UR10e实际限制）
      max_velocities:       # 各关节最大速度 (rad/s)
        shoulder_pan: 2.094    # 120°/s
        shoulder_lift: 2.094   # 120°/s
        elbow: 3.142           # 180°/s
        wrist_1: 3.142         # 180°/s
        wrist_2: 3.142         # 180°/s
        wrist_3: 3.142         # 180°/s

    position_error:          # 位置误差归一化 [-1, 1] → [-1, 1]
      range: [-1.0, 1.0]    # meters
      scale: 1.0            # 1/1.0

    distance:                # 距离归一化 [0, 2] → [0, 1]
      range: [0.0, 2.0]    # meters
      scale: 0.5            # 1/2.0

  # 目标位置范围（米） - 基于UR10e实际工作空间调整
  target_pos_range:
    x: [0.3, 1.2]              # X坐标范围（扩展到更合理的工作空间）
    y: [-0.8, 0.8]             # Y坐标范围（扩展）
    z: [0.1, 1.2]              # Z坐标范围（扩展到更高位置）

# PPO算法配置
ppo:
  # 学习率配置 - 使用更保守的学习率防止数值不稳定
  lr_actor: 0.0001               # Actor网络学习率（降低3倍）
  lr_critic: 0.0001              # Critic网络学习率（降低2倍）

  # PPO核心参数
  clip_eps: 0.2                # PPO裁剪参数ε
  gamma: 0.99                  # 折扣因子
  gae_lambda: 0.95             # GAE的λ参数

  # 损失函数权重
  entropy_coef: 0.01           # 熵正则化系数
  value_coef: 0.5              # 价值函数损失系数

  # 优化器配置
  max_grad_norm: 0.5           # 梯度裁剪范数

  # 训练参数
  epochs: 10                   # 每次更新训练轮数
  batch_size: 64               # 批量大小

# 多目标奖励函数配置（基于论文设计）
reward:
  # 混合控制��励函数配置（RL-PID调度）
  # 控制精度奖励
  accuracy:
    weight: 5.0                 # 精度权重（最重要）
    threshold: 0.005            # 成功阈值（米）

  # 控制稳定性奖励（PID参数调整幅度）
  stability:
    weight: 0.5                 # 稳定性权重
    max_change: 0.5             # 最大参数变化幅度

  # 响应速度奖励（误差收敛速度）
  speed:
    weight: 1.0                 # 速度权重

  # 能耗效率奖励
  energy:
    weight: 0.001               # 能耗权重

  # 额外奖励
  extra:
    success_reward: 10.0        # 成功到达目标位置的奖励

# 衰减回合机制配置（论文创新点）
decay_episode:
  enabled: true                 # 是否启用衰减回合机制
  initial_max_steps: 1000       # 初始最大步数
  min_max_steps: 200            # 最小最大步数
  success_threshold: 0.7        # 成功率阈值
  decay_window: 200             # 成功率计算窗口
  decay_step_size: 50           # 每次衰减的步数

# 训练配置
train:
  # 基础训练参数
  max_episodes: 50000           # 最大训练轮数
  save_interval: 500            # 模型保存间隔
  log_interval: 100             # 日志打印间隔
  eval_interval: 1000           # 评估间隔

  # 批量训练配置
  rollout_length: 1000          # Rollout长度

  # 检查点配置
  checkpoint_dir: "./checkpoints"  # 模型检查点目录

# Value Normalization配置
value_normalization:
  enabled: true                 # 是否启用值函数归一化
  beta: 0.995                   # 指数移动平均系数
  epsilon: 0.00000001            # 数值稳定性参数
  clip_range: 10.0              # 归一化值裁剪范围

# 评估配置
evaluation:
  enabled: true                 # 是否启用评估
  eval_episodes: 100            # 评估episode数量
  success_threshold: 0.005       # 成功阈值

  # 评估指标
  metrics:
    - success_rate              # 成功率
    - avg_episode_length        # 平均episode长度
    - avg_reward               # 平均奖励
    - trajectory_smoothness    # 轨迹平滑度
    - final_position_error     # 最终位置误差

# 日志和可视化配置
logging:
  # TensorBoard
  use_tensorboard: false        # 是否使用TensorBoard
  tensorboard_dir: "./logs"     # TensorBoard日志目录

  # CSV输出
  save_csv: true                # 是否保存CSV数据
  csv_dir: "./csv_output"       # CSV数据目录

  # 可视化
  save_plots: true             # 是否保存训练曲线
  plot_dir: "./plots"           # 训练曲线目录

  # 轨迹可视化
  save_trajectories: true       # 是否保存轨迹数据
  trajectory_dir: "./trajectories"  # 轨迹数据目录

# 随机种子
seed: 42

# 设备配置
device:
  gpu_id: 0                     # GPU设备ID（-1为CPU）
  use_cuda: true                # 是否使用CUDA

# 调试配置
debug:
  verbose: true                 # 详细输出
  save_debug_info: false        # 是否保存调试信息
  debug_dir: "./debug_output"   # 调试信息目录

# 高级配置
advanced:
  # GAE配置
  gae:
    enabled: true               # 是否使用GAE
    lambda: 0.95               # GAE的λ参数

  # 学习率调度
  lr_scheduler:
    enabled: false              # 是否使用学习率调度
    type: "cosine"             # 调度器类型
    T_max: 10000               # 调度周期

  # 优先经验回放
  prioritized_replay:
    enabled: false             # 是否使用优先经验回放
    alpha: 0.6                # 优先级指数
    beta: 0.4                 # 重要性采样权重

  # 网络架构
  network:
    actor_hidden_layers: [256, 256, 256]  # Actor网络隐藏层
    critic_hidden_layers: [256, 256, 256] # Critic网络隐藏层
    activation: "relu"         # 激活函数

  # 正则化
  regularization:
    dropout_rate: 0.1          # Dropout率
    weight_decay: 0.0          # 权重衰减

  # 经验回放缓冲区
  replay_buffer:
    size: 100000               # 缓冲区大小